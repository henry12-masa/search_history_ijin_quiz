<!DOCTYPE html>

<head>

<title>偉人の検索履歴クイズ｜もしGoogleがあったら</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Yu Gothic","Hiragino Sans",sans-serif;
  background:linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
  color:#fff;
}
.layout{
  display:flex;
  justify-content:center;
  align-items:flex-start;
  gap:20px;
  padding:20px;
}
.game{
  width:100%;
  max-width:760px;
  background:rgba(0,0,0,.64);
  border:2px solid #60a5fa;
  border-radius:18px;
  padding:26px;
  box-shadow:0 14px 35px rgba(0,0,0,.38);
}
h1{
  text-align:center;
  color:#bfdbfe;
  margin-top:0;
}
.sub{
  text-align:center;
  color:#ddd;
  margin-bottom:24px;
  line-height:1.7;
}
.status{
  display:flex;
  justify-content:space-between;
  color:#bfdbfe;
  font-weight:bold;
  margin-bottom:20px;
}
.question{
  background:rgba(255,255,255,.08);
  padding:22px;
  border-radius:14px;
  line-height:1.8;
  font-size:1.08rem;
  margin-bottom:20px;
  border-left:6px solid #60a5fa;
}
.searchbox{
  background:#f8fafc;
  color:#0f172a;
  border-radius:14px;
  padding:18px;
  margin-top:12px;
  box-shadow:inset 0 0 0 2px #cbd5e1;
}
.search-title{
  font-weight:bold;
  color:#2563eb;
  margin-bottom:10px;
}
.history-item{
  padding:10px 12px;
  margin:8px 0;
  background:#e0f2fe;
  border-radius:999px;
  font-weight:bold;
}
.choices{
  display:grid;
  gap:12px;
}
button{
  border:none;
  border-radius:12px;
  padding:15px;
  font-size:1rem;
  font-weight:bold;
  cursor:pointer;
  background:#dbeafe;
  color:#172554;
  transition:.15s;
}
button:hover{
  background:#eff6ff;
  transform:translateY(-1px);
}
button.correct{
  background:#22c55e;
  color:#fff;
}
button.wrong{
  background:#dc2626;
  color:#fff;
}
button:disabled{
  cursor:not-allowed;
  transform:none;
}
.result{
  margin-top:18px;
  min-height:50px;
  line-height:1.7;
  font-weight:bold;
}
.explain{
  color:#ddd;
  margin-top:8px;
  font-weight:normal;
}
.restart{
  display:none;
  margin-top:20px;
  width:100%;
  background:#2563eb;
  color:#fff;
}
.ad-area{
  width:320px;
  min-width:320px;
  position:sticky;
  top:20px;
}
.ad-box{
  background:rgba(0,0,0,.5);
  border:2px solid #60a5fa;
  border-radius:14px;
  padding:12px;
}
.ad-title{
  text-align:center;
  color:#bfdbfe;
  font-weight:bold;
  margin-bottom:10px;
}
.note{
  margin-top:18px;
  color:#cbd5e1;
  font-size:.9rem;
  line-height:1.7;
}
@media(max-width:1000px){
  .layout{flex-direction:column;align-items:center;}
  .ad-area{width:100%;min-width:auto;position:static;}
}
</style>
</head>
<body>

<div class="layout">

  <div class="game">
    <h1>偉人の検索履歴クイズ</h1>
    <div class="sub">もし歴史上の偉人たちがGoogleを使っていたら？ 検索履歴から人物を当てよう！</div>

    <div class="status">
      <div id="count">1 / 50</div>
      <div id="score">正解 0</div>
    </div>

    <div id="question" class="question"></div>
    <div id="choices" class="choices"></div>
    <div id="result" class="result"></div>

    <button id="restart" class="restart" onclick="restartGame()">もう一度遊ぶ</button>

    <div class="note">
      ※このクイズは、史実上の人物・出来事・業績をもとにした「もしGoogleがあったら」形式の創作雑学クイズです。
    </div>
  </div>

  <div class="ad-area">
    <div class="ad-box">
      <div class="ad-title">スポンサー</div>

    </div>
  </div>

</div>

const quizData = [];
for(let i = 0; i < 4; i++){
  baseQuizData.forEach(item => {
    quizData.push({
      q:item.q,
      history:[...item.history],
      choices:[...item.choices],
      answer:item.answer,
      explain:item.explain
    });
  });
}

let questions = [];
let current = 0;
let score = 0;
let lock = false;

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startGame(){
  questions = shuffle([...quizData]).slice(0,50);
  current = 0;
  score = 0;
  lock = false;
  document.getElementById("restart").style.display = "none";
  showQuestion();
}

function showQuestion(){
  lock = false;
  const q = questions[current];

  document.getElementById("count").textContent = `${current + 1} / 50`;
  document.getElementById("score").textContent = `正解 ${score}`;
  document.getElementById("question").innerHTML = `
    <div>${q.q}</div>
    <div class="searchbox">
      <div class="search-title">🔍 Google検索履歴</div>
      ${q.history.map(item => `<div class="history-item">${item}</div>`).join("")}
    </div>
  `;
  document.getElementById("result").innerHTML = "";

  const choicesEl = document.getElementById("choices");
  choicesEl.innerHTML = "";

  shuffle([...q.choices]).forEach(choice => {
    const btn = document.createElement("button");
    btn.textContent = choice;
    btn.onclick = () => checkAnswer(btn, choice);
    choicesEl.appendChild(btn);
  });
}

function checkAnswer(button, choice){
  if(lock) return;
  lock = true;

  const q = questions[current];
  const buttons = document.querySelectorAll("#choices button");

  buttons.forEach(btn => {
    btn.disabled = true;
    if(btn.textContent === q.answer){
      btn.classList.add("correct");
    }
  });

  if(choice === q.answer){
    score++;
    button.classList.add("correct");
    document.getElementById("result").innerHTML =
      `正解！<div class="explain">${q.explain}</div>`;
  }else{
    button.classList.add("wrong");
    document.getElementById("result").innerHTML =
      `不正解… 正解は「${q.answer}」<div class="explain">${q.explain}</div>`;
  }

  document.getElementById("score").textContent = `正解 ${score}`;

  setTimeout(() => {
    current++;
    if(current < questions.length){
      showQuestion();
    }else{
      finishGame();
    }
  }, 1700);
}

function finishGame(){
  document.getElementById("question").textContent =
    `50問終了！ ${score}問正解！`;

  document.getElementById("choices").innerHTML = "";

  let message = "";
  if(score >= 45){
    message = "検索履歴だけで偉人を見抜く、歴史探偵レベル！";
  }else if(score >= 30){
    message = "かなり詳しい！偉人の特徴をよくつかめています！";
  }else{
    message = "もう一度挑戦して、偉人たちのクセを覚えよう！";
  }

  document.getElementById("result").innerHTML = message;
  document.getElementById("restart").style.display = "block";
}

function restartGame(){
  startGame();
}

startGame();
